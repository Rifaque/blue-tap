name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper JAR checksum.
      - uses: gradle/actions/setup-gradle@v5

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK and run unit tests
        run: ./gradlew clean testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: bluetap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bluetap-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 60
